server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build artefacts are immutable; index.html must never be cached or
    # a deploy leaves browsers pinned to a bundle that no longer exists.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The sidecar's HTTP routes, reached through the same origin as the app.
    location /api/ {
        proxy_pass http://feed:7202/;
        proxy_http_version 1.1;
    }

    # The quote stream needs the upgrade headers or nginx closes the handshake.
    location /stream {
        proxy_pass http://feed:7202/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
